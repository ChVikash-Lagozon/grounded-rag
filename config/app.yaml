# Application config. Load order (later wins):
#   config/app.yaml -> config/local.yaml (optional, gitignored) -> CARQ__SECTION__KEY env vars
# ${VAR} / ${VAR:-default} are interpolated from the environment (and .env).
# Relative paths resolve against the repo root (the parent of the config directory).

environment: ${CARQ_ENV:-dev}

paths:
  data_root: ${DATA_ROOT:-data}
  catalog_path: ${CATALOG_PATH:-data/catalog.duckdb}
  docs_dir: docs              # generated docs (data profile, schema) are written here

storage:
  backend: ${STORAGE_BACKEND:-local}   # local (paths.data_root); adls is planned, see phase-2 §0

catalog:
  busy_timeout_seconds: 10    # refresh retries this long while another process holds the catalog
  history_limit: 5            # refreshes listed by `carq catalog status`

query:                        # limits for `carq query` and the query engine
  max_rows: 1000              # rows returned; more sets `truncated`
  timeout_seconds: 30         # validation + execution, per query
  memory_limit: 2GB           # DuckDB memory_limit on query connections
  threads: null               # null = DuckDB default (all cores)
  max_sql_chars: 20000
  explain_before_execute: true
  log_sql_max_chars: 4000

logging:
  level: INFO
  format: console   # console | json
  file: null        # optional path; the file always receives JSON lines
