failure_modes:
  Brakes: [Caliper piston leak, Brake noise, Uneven pad wear]
  Powertrain: [Oil leak, Turbocharger fault, Transmission shudder, Injector fault]
  Battery: [Cell voltage imbalance, Cooling circuit leak, Charging fault]
  Electrical: [Connector corrosion, Short circuit, Sensor fault]
  Infotainment: [Screen freeze, Bluetooth failure, Navigation fault]
  Suspension: [Strut leak, Bushing wear, Knocking noise]
  Body: [Actuator failure, Water ingress, Paint defect]

dealer_name_words: [Central, North, South, East, West, Park, Ring, Harbour, Valley, City, Riverside, Airport, Lakeside, Hill]
