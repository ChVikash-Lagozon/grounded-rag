# Tracked key parts. Each vehicle gets one part per tracked category (Battery for PHEV/BEV,
# Powertrain for ICE/Hybrid): the first part of that category whose `models` / `powertrains`
# filters match (a missing filter matches everything). `secondary_supplier` delivers
# `secondary_share` of batches (default from generator.yaml).
parts:
  - {name: Front brake caliper, category: Brakes, unit_cost: 145, primary_supplier: Kessler Bremsen, secondary_supplier: Ferrano Frenos, models: [Nova, Terra, Ion, Cargo]}
  - {name: Performance brake caliper, category: Brakes, unit_cost: 260, primary_supplier: Ferrano Frenos, secondary_supplier: Kessler Bremsen}
  - {name: Hybrid drive unit, category: Powertrain, unit_cost: 3100, primary_supplier: Trasmix Italia, secondary_supplier: Motorwerk Hansa, powertrains: [Hybrid]}
  - {name: 1.0 petrol engine, category: Powertrain, unit_cost: 2100, primary_supplier: Motorwerk Hansa, secondary_supplier: Trasmix Italia, models: [Nova]}
  - {name: 2.0 diesel engine, category: Powertrain, unit_cost: 3400, primary_supplier: Motorwerk Hansa, secondary_supplier: Trasmix Italia, models: [Cargo]}
  - {name: 2.0 petrol engine, category: Powertrain, unit_cost: 3000, primary_supplier: Trasmix Italia, secondary_supplier: Motorwerk Hansa, models: [Serene, Vista]}
  - {name: 1.5 petrol engine, category: Powertrain, unit_cost: 2500, primary_supplier: Motorwerk Hansa, secondary_supplier: Trasmix Italia}
  - {name: PHEV battery module, category: Battery, unit_cost: 2900, primary_supplier: Helion Energy, secondary_supplier: Nordvolt Cells, powertrains: [PHEV], secondary_share: 0.1}
  - {name: Battery pack 60-80 kWh, category: Battery, unit_cost: 7400, primary_supplier: Nordvolt Cells, secondary_supplier: Helion Energy, models: [Ion, Cargo], secondary_share: 0.45}
