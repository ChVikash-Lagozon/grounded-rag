  - {name: Main wiring harness, category: Electrical, unit_cost: 420, primary_supplier: Circuitex, secondary_supplier: Voltaris Elektrik}
  - {name: Compact infotainment unit, category: Infotainment, unit_cost: 380, primary_supplier: Lumen Media Systems, secondary_supplier: Sonaro Digital, models: [Nova, Ion, Cargo, Terra]}
  - {name: Premium infotainment unit, category: Infotainment, unit_cost: 720, primary_supplier: Sonaro Digital, secondary_supplier: Lumen Media Systems}
  - {name: Air suspension module, category: Suspension, unit_cost: 1150, primary_supplier: Federwerk, secondary_supplier: Ammortix, models: [Summit]}
  - {name: Front strut assembly, category: Suspension, unit_cost: 310, primary_supplier: Ammortix, secondary_supplier: Federwerk}
  - {name: Power tailgate actuator, category: Body, unit_cost: 240, primary_supplier: Karosserie Linz, secondary_supplier: Carrozza Parts, models: [Terra, Summit, Vista]}
