# Fictional reference catalogue for the synthetic data generator: brands, models, plants,
# geography, suppliers, parts and failure modes. Real countries and cities; every company and
# product name is made up. Edit freely - the generator reads everything from here.

# region > country > city. `weight` = share of vehicle demand (and dealers) per region.
