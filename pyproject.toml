[project]
name = "carquery"
version = "0.1.0"
description = "Natural-language query interface over parquet data (car manufacturer PoC)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5",
    "numpy>=2.4.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pytz>=2024.1",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.scripts]
carq = "carquery.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carquery"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint.per-file-ignores]
# Embedded SQL reads better unwrapped.
"src/carquery/generator/patterns.py" = ["E501"]
"tests/test_validation.py" = ["E501"]
